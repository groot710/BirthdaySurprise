<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Birthday Surprise 🎉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#ff9a9e;
      --bg2:#fad0c4;
      --accent:#ff4d6d;
      --card:#ffffff;
      --text:#2b2b2b;
      --shadow:0 10px 25px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:'Poppins',system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);}
    body{background: linear-gradient(135deg, var(--bg1), var(--bg2)); display:grid; place-items:center; overflow:hidden;}
    .hidden{display:none !important}

    .stage{width:min(100vw,900px);height:min(100vh,720px);display:grid;place-items:center;padding:24px;position:relative;}

    /* Gift box */
    .gift{display:grid;place-items:center;gap:12px;user-select:none;cursor:pointer;transform: translateZ(0);}
    .gift-emoji{font-size:120px;filter: drop-shadow(0 6px 10px rgba(0,0,0,.2));animation:bounce 1.5s ease-in-out infinite;}
    .hint{color:#fff;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.25);}
    @keyframes bounce{0%,100%{ transform: translateY(0) }50%{ transform: translateY(-18px) }}

    /* Card */
    .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px 22px 18px;width:min(560px, 92vw);text-align:center;animation:pop .35s ease;}
    @keyframes pop{from{ transform:scale(.96); opacity:0 }to{ transform:scale(1); opacity:1 }}
    .title{font-weight:800;font-size:clamp(20px, 3.2vw, 28px);margin:0 0 10px}
    .muted{opacity:.8;margin:0 0 12px}

    /* Input & button */
    .input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid #ffd5dd;outline:none;font-size:16px;}
    .btn{display:inline-block;padding:12px 16px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;box-shadow:var(--shadow);}
    .btn:active{transform:translateY(1px)}

    /* Greeting */
    .panda{ width:160px; height:auto; filter: drop-shadow(0 6px 12px rgba(0,0,0,.2)); }
    .greet-text{font-size:clamp(22px, 4vw, 34px);color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45);margin:10px 0 0;font-weight:800;}
    .gift-grid{margin-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
    .chip{background:rgba(255,255,255,.9);border-radius:14px;padding:12px 10px;font-size:22px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;box-shadow:0 4px 12px rgba(0,0,0,.12);user-select:none;}
    .chip:hover{ transform: translateY(-2px) }

    /* Toast */
    .toast{position:absolute;bottom:22px; left:50%;transform:translateX(-50%);background:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;animation:pop .25s ease;}

    /* Carousel */
    .scene{position:relative;width:100%;height:100%;display:grid;place-items:center;perspective:1000px;}
    .ring{width:100%;height:320px;position:relative;transform-style:preserve-3d;}
    .ring img{position:absolute;width:180px;height:220px;object-fit:cover;border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,.25);transition: transform 0.5s ease, z-index 0.5s ease;cursor:pointer;}

    .center-text{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;mix-blend-mode:normal;}
    .center-text h1{margin:0;font-size:clamp(26px, 5vw, 44px);color:#fff;text-align:center;text-shadow:0 4px 20px rgba(0,0,0,.6);font-weight:800;letter-spacing:.5px;}

    .spacer{height:12px;}
  </style>
</head>
<body>
  <main class="stage">
    <!-- Landing -->
    <section id="stepGift" class="gift">
      <div class="gift-emoji" aria-hidden="true">🎁</div>
      <div class="hint">Tap to open</div>
    </section>

    <!-- Name input -->
    <section id="stepName" class="card hidden" role="dialog" aria-modal="true" aria-labelledby="nameTitle">
      <h2 id="nameTitle" class="title">What’s your name? 🎀</h2>
      <p class="muted">We’ll put it on your birthday wish</p>
      <input id="nameInput" class="input" placeholder="Your name" autocomplete="name" />
      <div class="spacer"></div>
      <button id="nameGo" class="btn">Continue</button>
    </section>

    <!-- Greeting -->
    <section id="stepGreet" class="hidden" aria-live="polite">
      <img class="panda" src="bubu.gif" alt="Cute panda cheering" />
      <p id="greetLine" class="greet-text"></p>
      <div class="gift-grid" aria-label="Choose a gift">
        <div class="chip" data-msg="💖 You are the most special person in my life!">💖</div>
        <div class="chip" data-msg="🎁 My heart is the biggest gift for you!">🎁</div>
        <div class="chip" data-msg="🎉 Wishing you endless surprises and joy!">🎉</div>
        <div class="chip" data-msg="📸 Let’s relive our sweetest memories!">📸</div>
      </div>
    </section>

    <!-- Carousel -->
    <section id="stepCarousel" class="scene hidden" aria-live="polite">
      <div class="ring" id="ring"></div>
      <div class="center-text">
        <h1 id="centerHeading"></h1>
      </div>
    </section>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </main>

  <script>
    // Elements
    const stepGift = document.getElementById('stepGift');
    const stepName  = document.getElementById('stepName');
    const stepGreet = document.getElementById('stepGreet');
    const stepCarousel = document.getElementById('stepCarousel');
    const nameInput = document.getElementById('nameInput');
    const nameGo = document.getElementById('nameGo');
    const greetLine = document.getElementById('greetLine');
    const centerHeading = document.getElementById('centerHeading');
    const ring = document.getElementById('ring');
    const toast = document.getElementById('toast');

    // Photos
    const photos = [
      'photo1.jpg','photo2.jpg','photo3.jpg','photo4.jpg','photo5.jpg'
    ];

    // Flow
    stepGift.addEventListener('click', () => {
      stepGift.classList.add('hidden');
      stepName.classList.remove('hidden');
      setTimeout(()=> nameInput.focus(), 50);
    });

    nameGo.addEventListener('click', proceedName);
    nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') proceedName(); });

    function proceedName(){
      const name = (nameInput.value || 'Friend').trim();
      stepName.classList.add('hidden');
      stepGreet.classList.remove('hidden');
      greetLine.textContent = `Happy Birthday, ${name}! 🎂🐼`;
      centerHeading.textContent = `Happy Birthday, ${name}!`;
    }

    // Gift chips
    document.querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const msg = chip.getAttribute('data-msg') || '🎉';
        showToast(msg);
        setTimeout(()=>{
          stepGreet.classList.add('hidden');
          stepCarousel.classList.remove('hidden');
          buildCarousel();
        }, 1400);
      });
    });

    function showToast(message){
      toast.textContent = message;
      toast.classList.remove('hidden');
      setTimeout(()=> toast.classList.add('hidden'), 1200);
    }

    // Carousel logic
    let currentIndex = 0;
    const spacing = 45; // degrees between images
    let carouselInterval;

    function buildCarousel(){
      ring.innerHTML = '';
      const n = photos.length;
      if(n===0) return;
      photos.forEach((src,i)=>{
        const img = document.createElement('img');
        img.src = src;
        img.alt = `Memory ${i+1}`;
        ring.appendChild(img);
      });
      updateCarousel();
      clearInterval(carouselInterval);
      carouselInterval = setInterval(()=>{
        currentIndex = (currentIndex +1) % photos.length;
        updateCarousel();
      },2500);
    }

    function updateCarousel(){
      const imgs = ring.querySelectorAll('img');
      const n = imgs.length;
      imgs.forEach((img,i)=>{
        let offset = i - currentIndex;
        if(offset<-n/2) offset+=n;
        if(offset>n/2) offset-=n;
        const angle = offset*spacing;
        const scale = offset===0?1.2:0.8;
        const zIndex = n - Math.abs(offset);
        img.style.transform = `rotateY(${angle}deg) translateZ(400px) scale(${scale})`;
        img.style.zIndex = zIndex;
      });
    }

    // Preload images
    photos.forEach(src=>{ const im = new Image(); im.src = src; });
  </script>
</body>
</html>
