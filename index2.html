<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Surprise 🎉</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      text-align: center;
      background: linear-gradient(135deg, #ffdee9, #b5fffc);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }
    .hidden { display: none; }

    /* Gift Box */
    .gift-box {
      font-size: 100px;
      cursor: pointer;
      margin-top: 100px;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* Carousel */
    .carousel {
      perspective: 1000px;
      height: 400px;
      margin-top: 50px;
    }
    .carousel-inner {
      width: 300px;
      height: 300px;
      position: relative;
      margin: auto;
      transform-style: preserve-3d;
      animation: rotate 20s infinite linear;
    }
    .carousel-inner img {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    @keyframes rotate {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>

  <!-- Step 1: Gift Box -->
  <div id="giftBox" class="gift-box">🎁</div>

  <!-- Step 2: Name Input -->
  <div id="nameSection" class="hidden container mt-5">
    <div class="card shadow-lg p-4 rounded-4">
      <h3 class="mb-3">Enter your name 🎂</h3>
      <input type="text" id="nameInput" class="form-control mb-3" placeholder="Your name">
      <button onclick="showGreeting()" class="btn btn-primary w-100">Open Surprise</button>
    </div>
  </div>

  <!-- Step 3: Panda + Greeting -->
  <div id="greetingSection" class="hidden mt-5">
    <img src="bubu.gif" alt="Cute Panda" width="200"><br>
    <h2 id="greetingText"></h2>
    <div class="mt-4">
      <button onclick="chooseGift('Love 💖')" class="btn btn-outline-danger m-2">💖 Love</button>
      <button onclick="chooseGift('Surprise 🎉')" class="btn btn-outline-success m-2">🎉 Surprise</button>
      <button onclick="chooseGift('Gift 🎁')" class="btn btn-outline-warning m-2">🎁 Gift</button>
      <button onclick="chooseGift('Memory 📸')" class="btn btn-outline-info m-2">📸 Memory</button>
    </div>
  </div>

  <!-- Step 4: Gift Message -->
  <div id="giftMessageSection" class="hidden mt-4">
    <div class="card shadow p-3 rounded-4">
      <h4 id="giftMessage"></h4>
    </div>
  </div>

  <!-- Step 5a: Carousel -->
  <div id="carouselSection" class="carousel hidden">
    <div class="carousel-inner">
      <img src="photo1.jpg" style="transform: rotateY(0deg) translateZ(400px);">
      <img src="photo2.jpg" style="transform: rotateY(72deg) translateZ(400px);">
      <img src="photo3.jpg" style="transform: rotateY(144deg) translateZ(400px);">
      <img src="photo4.jpg" style="transform: rotateY(216deg) translateZ(400px);">
      <img src="photo5.jpg" style="transform: rotateY(288deg) translateZ(400px);">
    </div>
    <button onclick="goBack()" class="btn btn-dark mt-4">⬅ Back</button>
  </div>

  <!-- Step 5b: Gallery -->
  <div id="gallerySection" class="hidden container mt-4">
    <h3 class="mb-3">🎉 Surprise Gallery</h3>
    <div class="row">
      <div class="col-6 col-md-4 mb-3"><img src="photo1.jpg" class="img-fluid rounded shadow"></div>
      <div class="col-6 col-md-4 mb-3"><img src="photo2.jpg" class="img-fluid rounded shadow"></div>
      <div class="col-6 col-md-4 mb-3"><img src="photo3.jpg" class="img-fluid rounded shadow"></div>
      <div class="col-6 col-md-4 mb-3"><img src="photo4.jpg" class="img-fluid rounded shadow"></div>
      <div class="col-6 col-md-4 mb-3"><img src="photo5.jpg" class="img-fluid rounded shadow"></div>
    </div>
    <button onclick="goBack()" class="btn btn-dark mt-3">⬅ Back</button>
  </div>

  <!-- Step 5c: Special Gift Card -->
  <div id="specialGiftSection" class="hidden mt-5">
    <div class="card shadow-lg p-4 rounded-4 bg-warning text-dark">
      <h2>🎁 My Heart is the Biggest Gift for You!</h2>
      <p class="mt-3">Keep smiling always 💖</p>
    </div>
    <button onclick="goBack()" class="btn btn-dark mt-3">⬅ Back</button>
  </div>

  <!-- Step 5d: Slideshow -->
  <div id="slideshowSection" class="hidden mt-4">
    <h3>📸 Sweet Memories</h3>
    <img id="slideshowImage" src="photo1.jpg" class="img-fluid rounded shadow mt-3" width="300">
    <button onclick="goBack()" class="btn btn-dark mt-3">⬅ Back</button>
  </div>

  <script>
    // Step 1: Gift box → Name input
    document.getElementById("giftBox").addEventListener("click", () => {
      document.getElementById("giftBox").classList.add("hidden");
      document.getElementById("nameSection").classList.remove("hidden");
    });

    // Step 2: Show greeting with name
    function showGreeting() {
      const name = document.getElementById("nameInput").value || "Friend";
      document.getElementById("nameSection").classList.add("hidden");
      document.getElementById("greetingSection").classList.remove("hidden");
      document.getElementById("greetingText").innerText = `Happy Birthday, ${name}! 🎂🐼`;
    }

    // Step 3: Choose gift
    function chooseGift(option) {
      let message = "";
      if (option.includes("Love")) message = "💖 You are the most special person in my life!";
      else if (option.includes("Surprise")) message = "🎉 Wishing you endless surprises and joy!";
      else if (option.includes("Gift")) message = "🎁 My heart is the biggest gift for you!";
      else if (option.includes("Memory")) message = "📸 Let’s relive our sweetest memories!";
      
      document.getElementById("giftMessage").innerText = message;
      document.getElementById("giftMessageSection").classList.remove("hidden");

      setTimeout(() => {
        document.getElementById("giftMessageSection").classList.add("hidden");
        showSection(option);
      }, 2000);
    }

    // Step 4: Show selected section
    function showSection(option) {
      hideAll();

      if (option.includes("Love")) {
        document.getElementById("carouselSection").classList.remove("hidden");
      } else if (option.includes("Surprise")) {
        document.getElementById("gallerySection").classList.remove("hidden");
      } else if (option.includes("Gift")) {
        document.getElementById("specialGiftSection").classList.remove("hidden");
      } else if (option.includes("Memory")) {
        document.getElementById("slideshowSection").classList.remove("hidden");
        startSlideshow();
      }
    }

    // Helper: Hide all surprise sections
    function hideAll() {
      document.getElementById("carouselSection").classList.add("hidden");
      document.getElementById("gallerySection").classList.add("hidden");
      document.getElementById("specialGiftSection").classList.add("hidden");
      document.getElementById("slideshowSection").classList.add("hidden");
    }

    // Back button logic
    function goBack() {
      hideAll();
      document.getElementById("greetingSection").classList.remove("hidden");
    }

    // Slideshow logic
    let slideIndex = 0;
    const slideImages = ["photo1.jpg", "photo2.jpg", "photo3.jpg", "photo4.jpg", "photo5.jpg"];
    function startSlideshow() {
      const img = document.getElementById("slideshowImage");
      setInterval(() => {
        slideIndex = (slideIndex + 1) % slideImages.length;
        img.src = slideImages[slideIndex];
      }, 2000);
    }
  </script>

</body>
</html>
